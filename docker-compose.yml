# Local PostgreSQL for development and tests:  docker compose up -d
# The init script creates a NON-superuser "trustvault" that owns both databases.
# (Superusers bypass row-level security, so the app must never use one.)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
